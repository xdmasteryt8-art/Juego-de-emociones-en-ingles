
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guess the Emotion!</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px;
  font-family: "Trebuchet MS", Arial, sans-serif;
  color: #26305e;
  background: linear-gradient(135deg, #78e9f5, #b9a2ff, #ffc5e6);
  display: flex;
  justify-content: center;
  align-items: center;
}

.game {
  width: 100%;
  max-width: 540px;
  padding: 25px;
  border: 4px solid white;
  border-radius: 30px;
  background: #ffffffef;
  text-align: center;
  box-shadow: 0 12px 35px #34306430;
}

h1 {
  color: #7547dc;
  font-size: clamp(27px, 6vw, 38px);
  margin: 5px 0;
}

.subtitle { color: #666b91; }

button {
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .15s, background .15s;
}

button:hover { transform: translateY(-2px); }
button:focus-visible { outline: 3px solid #303060; }

.primary {
  border: 0;
  border-radius: 18px;
  padding: 15px 22px;
  width: 100%;
  background: #7547dc;
  color: white;
  font-size: 20px;
  font-weight: bold;
  margin-top: 12px;
}

.secondary {
  border: 2px solid #ded4ff;
  background: white;
  border-radius: 14px;
  padding: 10px 15px;
  color: #5540a5;
  font-size: 16px;
}

.face {
  font-size: 100px;
  margin: 12px 0;
  animation: bounce 1.5s infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

@keyframes pop {
  0% { transform: scale(.8); }
  70% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

.question {
  font-size: 21px;
  font-weight: bold;
  line-height: 1.45;
  margin: 15px 0;
}

.answers {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 18px;
}

.answer {
  border: 3px solid #e8e2ff;
  border-radius: 17px;
  padding: 14px;
  background: #f5f1ff;
  color: #35305e;
  font-size: 19px;
  font-weight: bold;
}

.answer.correct {
  background: #c6f8d3;
  border-color: #42bb71;
}

.answer.wrong {
  background: #ffe0e5;
  border-color: #f18b9a;
}

.answer:disabled { cursor: default; }

.progress {
  background: #e9e3ff;
  height: 13px;
  border-radius: 20px;
  overflow: hidden;
  margin: 12px 0;
}

#bar {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #6de0c2, #8c66f5);
  transition: width .3s;
}

.stats {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: bold;
  font-size: 15px;
}

#feedback {
  min-height: 52px;
  font-size: 18px;
  font-weight: bold;
  margin: 12px 0 0;
}

.hidden { display: none !important; }

.stars { font-size: 40px; }

.tiny { font-size: 14px; color: #737694; }

@media (min-width: 420px) {
  .answers { grid-template-columns: 1fr 1fr; }
  .answer { min-height: 75px; }
}
</style>
</head>

<body>
<main class="game">

  <section id="home">
    <div class="face">🌈</div>
    <h1>Guess the Emotion!</h1>
    <p class="subtitle">Learn English, understand feelings and have fun!</p>
    <div style="font-size:48px;margin:20px">😊 😢 😡 😲</div>
    <p>🎯 Choose the correct emotion.</p>
    <p>⭐ Earn points and become an Emotion Star!</p>
    <button class="primary" onclick="startGame()">PLAY NOW 🚀</button>
    <p class="tiny">Made for young English learners</p>
  </section>

  <section id="playing" class="hidden">
    <div class="stats">
      <span>⭐ Score: <span id="score">0</span></span>
      <span>🔥 Streak: <span id="streak">0</span></span>
      <span>📝 <span id="number">1</span>/<span id="total">10</span></span>
    </div>

    <div class="progress"><div id="bar"></div></div>

    <div class="face" id="face">😊</div>

    <button class="secondary" onclick="speakQuestion()">
      🔊 Listen to English
    </button>

    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div id="feedback" aria-live="polite"></div>

    <button id="next" class="primary hidden" onclick="nextQuestion()">
      NEXT ➜
    </button>
  </section>

  <section id="results" class="hidden">
    <div class="face">🏆</div>
    <h1>Fantastic Job!</h1>
    <p id="resultMessage" class="question"></p>
    <div class="stars" id="stars">⭐⭐⭐</div>
    <h2 id="finalScore"></h2>
    <p id="finalAccuracy"></p>
    <p>You are an Emotion Star! 🌟</p>
    <button class="primary" onclick="startGame()">PLAY AGAIN 🔄</button>
    <button class="secondary" onclick="goHome()">HOME 🏠</button>
  </section>

</main>

<script>
const bank = [
  {
    face:"😊", word:"Happy",
    clue:"You get a wonderful birthday present. You smile and laugh. How do you feel?",
    options:["Happy","Sad","Angry","Scared"]
  },
  {
    face:"😢", word:"Sad",
    clue:"You miss your friend. You feel like crying. How do you feel?",
    options:["Excited","Sad","Surprised","Happy"]
  },
  {
    face:"😠", word:"Angry",
    clue:"Someone takes your toy without asking. You feel upset. How do you feel?",
    options:["Happy","Sleepy","Angry","Calm"]
  },
  {
    face:"😨", word:"Scared",
    clue:"You hear a strange noise during a storm. You feel afraid. How do you feel?",
    options:["Scared","Proud","Happy","Bored"]
  },
  {
    face:"😲", word:"Surprised",
    clue:"Your friends shout, 'Surprise!' at your party. How do you feel?",
    options:["Sad","Angry","Sleepy","Surprised"]
  },
  {
    face:"🤩", word:"Excited",
    clue:"Tomorrow you visit your favorite park. You cannot wait! How do you feel?",
    options:["Bored","Excited","Scared","Sad"]
  },
  {
    face:"😌", word:"Calm",
    clue:"You sit quietly and listen to gentle music. You feel peaceful. How do you feel?",
    options:["Angry","Worried","Calm","Excited"]
  },
  {
    face:"😴", word:"Sleepy",
    clue:"It is late at night. You yawn and want to go to bed. How do you feel?",
    options:["Sleepy","Surprised","Proud","Happy"]
  },
  {
    face:"😟", word:"Worried",
    clue:"You cannot find your school bag and you are concerned. How do you feel?",
    options:["Happy","Worried","Calm","Excited"]
  },
  {
    face:"😎", word:"Proud",
    clue:"You work hard on a drawing and finish it. You feel good about your work. How do you feel?",
    options:["Scared","Sad","Proud","Angry"]
  }
];

let questions = [];
let index = 0;
let score = 0;
let streak = 0;
let answered = false;
let pointsEarned = [];

function shuffle(arr) {
  return arr.slice().sort(() => Math.random() - 0.5);
}

function show(id) {
  ["home","playing","results"].forEach(s => {
    document.getElementById(s).classList.toggle("hidden", s !== id);
  });
}

function startGame() {
  questions = shuffle(bank).map(q => ({
    ...q,
    options: shuffle(q.options)
  }));
  index = 0;
  score = 0;
  streak = 0;
  pointsEarned = [];
  document.getElementById("score").textContent = score;
  document.getElementById("streak").textContent = streak;
  document.getElementById("total").textContent = questions.length;
  show("playing");
  renderQuestion();
}

function renderQuestion() {
  answered = false;
  const q = questions[index];

  document.getElementById("number").textContent = index + 1;
  document.getElementById("bar").style.width =
    (index / questions.length * 100) + "%";
  document.getElementById("face").textContent = q.face;
  document.getElementById("question").textContent = q.clue;
  document.getElementById("feedback").textContent = "";
  document.getElementById("next").classList.add("hidden");

  const area = document.getElementById("answers");
  area.innerHTML = "";

  q.options.forEach(option => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = option;
    btn.onclick = () => checkAnswer(option, btn);
    area.appendChild(btn);
  });
}

function checkAnswer(answer, btn) {
  if (answered) return;
  answered = true;

  const q = questions[index];
  const buttons = document.querySelectorAll(".answer");
  buttons.forEach(b => b.disabled = true);

  if (answer === q.word) {
    const earned = 10 + streak * 2;
    score += earned;
    streak++;
    pointsEarned.push(true);
    btn.classList.add("correct");
    document.getElementById("feedback").textContent =
      "🎉 Correct! +" + earned + " points! Great job!";
  } else {
    streak = 0;
    pointsEarned.push(false);
    btn.classList.add("wrong");

    buttons.forEach(b => {
      if (b.textContent === q.word) b.classList.add("correct");
    });

    document.getElementById("feedback").textContent =
      "💛 Good try! The answer is " + q.word + ".";
  }

  document.getElementById("score").textContent = score;
  document.getElementById("streak").textContent = streak;
  document.getElementById("bar").style.width =
    ((index + 1) / questions.length * 100) + "%";

  const next = document.getElementById("next");
  next.textContent = index === questions.length - 1
    ? "SEE MY RESULTS 🏆" : "NEXT QUESTION ➜";
  next.classList.remove("hidden");
}

function nextQuestion() {
  if (index < questions.length - 1) {
    index++;
    renderQuestion();
  } else {
    finishGame();
  }
}

function finishGame() {
  show("results");
  const correct = pointsEarned.filter(Boolean).length;
  const percent = Math.round(correct / questions.length * 100);

  document.getElementById("finalScore").textContent =
    "⭐ " + score + " points";
  document.getElementById("finalAccuracy").textContent =
    "Correct answers: " + correct + " out of " + questions.length;

  document.getElementById("stars").textContent =
    percent === 100 ? "⭐⭐⭐" : percent >= 60 ? "⭐⭐" : "⭐";

  document.getElementById("resultMessage").textContent =
    percent === 100 ? "Perfect! You know your emotions!" :
    percent >= 60 ? "Well done! Keep learning English!" :
    "Nice try! Practice makes progress!";

  document.getElementById("bar").style.width = "100%";
}

function speakQuestion() {
  if (!("speechSynthesis" in window)) {
    document.getElementById("feedback").textContent =
      "Audio is not available in this browser.";
    return;
  }

  const q = questions[index];
  const utterance = new SpeechSynthesisUtterance(
    q.clue + " " + q.options.join(". ")
  );
  utterance.lang = "en-US";
  utterance.rate = 0.8;
  speechSynthesis.cancel();
  speechSynthesis.speak(utterance);
}

function goHome() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  show("home");
}
</script>
</body>
</html>
